name: cloud_disk
description: "Local-first Personal Workbench for Windows desktop"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  fluent_ui: ^4.16.1
  go_router: ^6.5.6
  bitsdojo_window: ^0.1.5
  system_tray: ^2.0.2
  http: ^0.13.3
  flutter_svg: ^2.0.9
  path_provider: ^2.0.5
  file_picker: ^8.0.0+1
  path: ^1.8.0
  drift: 2.15.0
  sqlite3_flutter_libs: ^0.5.20
  archive: ^3.2.0
  clipboard: ^0.1.3
  audioplayers: ^6.8.1
  shared_preferences: ^2.2.3
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/login/
    - assets/images/
    - assets/mp3/
