name: cloud_disk
description: "Shared cloud storage"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  fluent_ui: ^4.5.0
  go_router: ^6.5.6
  bitsdojo_window: ^0.1.5
  system_tray: ^2.0.2
  http: ^0.13.3
  flutter_svg: ^2.0.9
  path_provider: ^2.0.5
  file_picker: ^8.0.0+1
  flutter_calendar_carousel: ^2.4.2
  logging: ^1.0.0
  path: ^1.8.0
  intl: ^0.20.3
  sqflite: ^2.0.0
  sqflite_common_ffi: ^2.1.1
  drift: 2.15.0
  sqlite3_flutter_libs: ^0.5.20
  archive: ^3.2.0
  xml: ^6.0.0
  pdf: ^3.6.0
  clipboard: ^0.1.3
  fl_chart: ^0.63.0
  network_info_plus: ^4.1.0
  connectivity_plus: ^5.0.2
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  shared_preferences: ^2.2.3
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/login/
    - assets/images/
    - assets/mp3/
