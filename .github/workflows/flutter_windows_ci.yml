name: Flutter Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and Test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  windows-build:
    name: Windows Release Build
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Smoke Windows release
        shell: powershell
        run: ./tool/verify_windows_release.ps1

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: personal-workbench-windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
