name: Flutter Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and Test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Validate PowerShell verification scripts
        shell: powershell
        run: |
          $files = @(
            './tool/verify_windows_release.ps1',
            './tool/verify_stable_v1.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Test
        run: flutter test

      - name: Scale verification smoke
        run: >
          flutter test test/manual/workbench_scale_verification_test.dart
          --dart-define=WORKBENCH_SCALE_VERIFY=true
          --dart-define=WORKBENCH_SCALE_WORKSPACES=1
          --dart-define=WORKBENCH_SCALE_TASKS_PER_WORKSPACE=10
          --dart-define=WORKBENCH_SCALE_NOTES_PER_WORKSPACE=3
          --dart-define=WORKBENCH_SCALE_NOTE_BODY_BYTES=512

  windows-build:
    name: Windows Release Build
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Smoke Windows release
        shell: powershell
        run: ./tool/verify_windows_release.ps1

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: personal-workbench-windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
